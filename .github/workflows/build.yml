name: Build and Package Rin (Windows)

# This is the first time Rin-windows has ever gone through an actual
# compile (per DESIGN_NOTES.md/README.md, RinWindows.exe was written
# against the Win32/WinRT API directly but never built against a real
# Windows SDK/MSVC). Treat a red run here as genuinely new information,
# not a CI misconfiguration -- same situation as TOKI's installer.iss
# initially having an uncaught Pascal Script bug.
#
# Builds against vcpkg's x64-windows-static triplet with a statically
# linked MSVC CRT (/MT), specifically so RinWindows.exe ends up fully
# self-contained -- no OpenSSL/libqrencode/vcruntime DLLs to bundle or
# chase down in the installer. Bootstraps its own vcpkg checkout rather
# than using whatever's pre-installed on the runner (see the Bootstrap
# vcpkg step for why).

on:
  push:
    branches: [main]
    paths:
      - "**.cpp"
      - "**.h"
      - "**.hpp"
      - "**.manifest"
      - "CMakeLists.txt"
      - "tests/CMakeLists.txt"
      - "installer.iss"
      - ".github/workflows/build.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Also attach the built installer to a GitHub Release"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Bootstrap vcpkg
        shell: pwsh
        run: |
          # Not using the runner's pre-installed vcpkg: VCPKG_INSTALLATION_ROOT
          # has a documented history of pointing at different things across
          # runner image versions -- sometimes a plain C:\vcpkg, sometimes the
          # MSVC-bundled copy under "Program Files", which doesn't support
          # classic-mode `vcpkg install` the same way (see
          # actions/runner-images#9269). Cloning our own avoids depending on
          # whichever one happens to be there.
          git clone https://github.com/microsoft/vcpkg.git "$env:GITHUB_WORKSPACE\vcpkg-ci"
          & "$env:GITHUB_WORKSPACE\vcpkg-ci\bootstrap-vcpkg.bat"

      - name: Install vcpkg dependencies (static triplet)
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE\vcpkg-ci\vcpkg.exe" install `
            openssl:x64-windows-static `
            libqrencode:x64-windows-static

      # ZXing is intentionally not installed here -- CMakeLists.txt/
      # tests/CMakeLists.txt both treat it as optional and skip the
      # ZXing-dependent parts (camera QR scanning, one round-trip test)
      # when it's not found, per their own comments.

      - name: Configure (static CRT + static vcpkg triplet)
        id: cmake_configure
        shell: pwsh
        continue-on-error: true
        run: |
          cmake -B build -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="$env:GITHUB_WORKSPACE\vcpkg-ci\scripts\buildsystems\vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static `
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded *>&1 | Tee-Object -FilePath cmake_configure_output.log
          exit $LASTEXITCODE

      - name: Commit configure log on failure (self-diagnosing)
        if: steps.cmake_configure.outcome == 'failure'
        shell: pwsh
        run: |
          # No .gitignore here so this wasn't the bug on this repo, but
          # PowerShell steps in GH Actions don't fail on a nonzero exit
          # code from an external command unless you check it yourself --
          # confirmed that silently ate a failure on BlazEng's equivalent
          # step, so checking every git call explicitly here too.
          git config user.email "ci@github-actions.local"
          git config user.name "GitHub Actions CI"
          git fetch origin ci-debug-logs 2>$null
          git checkout -B ci-debug-logs
          Copy-Item cmake_configure_output.log "cmake-configure-run$env:GITHUB_RUN_NUMBER.log"
          git add -f "cmake-configure-run$env:GITHUB_RUN_NUMBER.log"
          if ($LASTEXITCODE -ne 0) { Write-Error "git add failed"; exit 1 }
          git commit -m "CI debug log: CMake configure failure, run $env:GITHUB_RUN_NUMBER"
          if ($LASTEXITCODE -ne 0) { Write-Error "git commit failed"; exit 1 }
          git push origin ci-debug-logs --force
          if ($LASTEXITCODE -ne 0) { Write-Error "git push failed"; exit 1 }

      - name: Fail the job if configure actually failed
        if: steps.cmake_configure.outcome == 'failure'
        shell: pwsh
        run: exit 1

      - name: Build (Release)
        id: cmake_build
        shell: pwsh
        continue-on-error: true
        run: |
          cmake --build build --config Release -j *>&1 | Tee-Object -FilePath cmake_build_output.log
          exit $LASTEXITCODE

      - name: Commit build log on failure (self-diagnosing)
        if: steps.cmake_build.outcome == 'failure'
        shell: pwsh
        run: |
          git config user.email "ci@github-actions.local"
          git config user.name "GitHub Actions CI"
          git fetch origin ci-debug-logs 2>$null
          git checkout -B ci-debug-logs
          Copy-Item cmake_build_output.log "cmake-build-run$env:GITHUB_RUN_NUMBER.log"
          git add -f "cmake-build-run$env:GITHUB_RUN_NUMBER.log"
          if ($LASTEXITCODE -ne 0) { Write-Error "git add failed"; exit 1 }
          git commit -m "CI debug log: CMake build failure, run $env:GITHUB_RUN_NUMBER"
          if ($LASTEXITCODE -ne 0) { Write-Error "git commit failed"; exit 1 }
          git push origin ci-debug-logs --force
          if ($LASTEXITCODE -ne 0) { Write-Error "git push failed"; exit 1 }

      - name: Fail the job if build actually failed
        if: steps.cmake_build.outcome == 'failure'
        shell: pwsh
        run: exit 1

      - name: Run test suite
        id: run_tests
        shell: pwsh
        continue-on-error: true
        run: |
          ctest --test-dir build -C Release --output-on-failure *>&1 | Tee-Object -FilePath ctest_output.log
          exit $LASTEXITCODE

      - name: Commit test log on failure (self-diagnosing)
        if: steps.run_tests.outcome == 'failure'
        shell: pwsh
        run: |
          git config user.email "ci@github-actions.local"
          git config user.name "GitHub Actions CI"
          git fetch origin ci-debug-logs 2>$null
          git checkout -B ci-debug-logs
          Copy-Item ctest_output.log "ctest-run$env:GITHUB_RUN_NUMBER.log"
          git add -f "ctest-run$env:GITHUB_RUN_NUMBER.log"
          if ($LASTEXITCODE -ne 0) { Write-Error "git add failed"; exit 1 }
          git commit -m "CI debug log: ctest failure, run $env:GITHUB_RUN_NUMBER"
          if ($LASTEXITCODE -ne 0) { Write-Error "git commit failed"; exit 1 }
          git push origin ci-debug-logs --force
          if ($LASTEXITCODE -ne 0) { Write-Error "git push failed"; exit 1 }

      - name: Fail the job if tests actually failed
        if: steps.run_tests.outcome == 'failure'
        shell: pwsh
        run: exit 1

      - name: Verify expected executables exist
        shell: pwsh
        run: |
          foreach ($exe in "build\Release\RinWindows.exe", "build\Release\rin-console.exe") {
            if (-not (Test-Path $exe)) {
              Write-Error "$exe was not produced -- check the build log above."
              exit 1
            }
          }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Compile installer.iss
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "installer.iss"

      - name: Locate compiled installer
        id: out
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path "dist" -Filter "Rin-Setup-*.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) {
            Write-Error "No Rin-Setup-*.exe found in dist\ -- check the ISCC log above."
            exit 1
          }
          echo "path=$($exe.FullName)" >> $env:GITHUB_OUTPUT
          echo "name=$($exe.Name)" >> $env:GITHUB_OUTPUT

      - name: Upload build artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.out.outputs.name }}
          path: ${{ steps.out.outputs.path }}
          retention-days: 30

      - name: Publish GitHub Release
        if: github.event_name == 'workflow_dispatch' && inputs.publish_release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v1.0.0-${{ github.run_number }}
          name: Rin (Windows) build ${{ github.run_number }}
          files: ${{ steps.out.outputs.path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # -------------------------------------------------------------------
  # Diagnostic only -- no `needs:` in either direction between this and
  # `build`, so this can never block the release pipeline no matter how
  # it turns out. That's the mistake last time: the ASan job never got
  # usable output in two days of trying and just sat there unable to
  # even compile/link. /RTC1 needs no extra sanitizer runtime (unlike
  # ASan), CMake already turns it on automatically for MSVC Debug
  # builds, and on a hit it reports the exact function + variable at
  # the moment of corruption instead of a bare 0xc0000409 -- so this
  # should either nail the exact line on the first run, or at least
  # rule out the /EHsc-related stack corruption theory in
  # CMakeLists.txt concretely instead of by inference (that theory's
  # fix -- add_compile_options(/EHsc) -- is already in CMakeLists.txt
  # as of the current commit and rin_tests still crashed identically in
  # run 37, so it's not actually confirmed to be the cause).
  diagnostic_debug_rtc:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Bootstrap vcpkg
        shell: pwsh
        run: |
          git clone https://github.com/microsoft/vcpkg.git "$env:GITHUB_WORKSPACE\vcpkg-ci"
          & "$env:GITHUB_WORKSPACE\vcpkg-ci\bootstrap-vcpkg.bat"

      - name: Install vcpkg dependencies (static triplet)
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE\vcpkg-ci\vcpkg.exe" install `
            openssl:x64-windows-static `
            libqrencode:x64-windows-static

      - name: Configure (Debug -- CMake applies /RTC1 automatically for MSVC Debug)
        shell: pwsh
        run: |
          cmake -B build-debug -A x64 `
            -DCMAKE_BUILD_TYPE=Debug `
            -DCMAKE_TOOLCHAIN_FILE="$env:GITHUB_WORKSPACE\vcpkg-ci\scripts\buildsystems\vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static `
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreadedDebug

      - name: Build (Debug)
        shell: pwsh
        run: cmake --build build-debug --config Debug -j

      - name: Run rin_tests directly (not via ctest -- want the raw RTC output)
        id: run_debug_tests
        shell: pwsh
        continue-on-error: true
        run: |
          & "build-debug\tests\Debug\rin_tests.exe" *>&1 | Tee-Object -FilePath rtc_debug_output.log
          exit $LASTEXITCODE

      - name: Always commit the debug/RTC log, pass or fail
        shell: pwsh
        run: |
          git config user.email "ci@github-actions.local"
          git config user.name "GitHub Actions CI"
          git fetch origin ci-debug-logs 2>$null
          git checkout -B ci-debug-logs
          Copy-Item rtc_debug_output.log "rtc-debug-run$env:GITHUB_RUN_NUMBER.log"
          git add -f "rtc-debug-run$env:GITHUB_RUN_NUMBER.log"
          if ($LASTEXITCODE -ne 0) { Write-Error "git add failed"; exit 1 }
          git commit -m "CI debug log: /RTC1 debug run $env:GITHUB_RUN_NUMBER"
          if ($LASTEXITCODE -ne 0) { Write-Error "git commit failed"; exit 1 }
          git push origin ci-debug-logs --force
          if ($LASTEXITCODE -ne 0) { Write-Error "git push failed"; exit 1 }


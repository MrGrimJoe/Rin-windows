name: Build and Package Rin (Windows)

# This is the first time Rin-windows has ever gone through an actual
# compile (per DESIGN_NOTES.md/README.md, RinWindows.exe was written
# against the Win32/WinRT API directly but never built against a real
# Windows SDK/MSVC). Treat a red run here as genuinely new information,
# not a CI misconfiguration.
#
# Builds against vcpkg's x64-windows-static triplet with a statically
# linked MSVC CRT (/MT), specifically so RinWindows.exe ends up fully
# self-contained -- no OpenSSL/libqrencode/vcruntime DLLs to bundle or
# chase down in the installer. Bootstraps its own vcpkg checkout rather
# than using whatever's pre-installed on the runner (see the Bootstrap
# vcpkg step for why).
#
# LOGGING: all diagnostic logs (configure/build/test/ASan) are captured
# with Tee-Object and uploaded as workflow run artifacts via
# actions/upload-artifact with `if: always()`. This replaced an earlier
# approach that committed logs to a shared `ci-debug-logs` git branch --
# that approach had a real race (two jobs force-pushing the same branch
# could silently clobber each other's log) and a real staging bug (the
# "clean the branch to log-only" step deleted old files from disk but
# never staged the deletion, so every commit re-added the whole source
# tree). Artifacts are per-job, race-free by construction, and need no
# custom retry/cleanup logic -- download them from the run's Summary
# page under "Artifacts".

on:
  push:
    branches: [main]
    paths:
      - "**.cpp"
      - "**.h"
      - "**.hpp"
      - "**.manifest"
      - "CMakeLists.txt"
      - "tests/CMakeLists.txt"
      - "installer.iss"
      - ".github/workflows/build.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Also attach the built installer to a GitHub Release"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  # Diagnostic-only job: builds rin_tests with MSVC's /fsanitize=address and
  # runs it directly (not via ctest, so we get raw ASan output on stdout
  # instead of just an exit code). This exists specifically because
  # rin_tests has been crashing with 0xc0000409 (STATUS_STACK_BUFFER_OVERRUN)
  # inside the audit-logger test on the real Windows/vcpkg build, and it
  # reproduces cleanly under AddressSanitizer/UBSan on Linux against the
  # identical code and inputs -- so the goal here is purely to get a precise
  # ASan crash report (exact file/line/allocation) from the real Windows
  # toolchain, since that's not something reproducible off-platform.
  # Always uploads its log (pass or fail) so a clean run is also visible.
  asan_diagnostic:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Bootstrap vcpkg
        shell: pwsh
        run: |
          git clone https://github.com/microsoft/vcpkg.git "$env:GITHUB_WORKSPACE\vcpkg-ci"
          & "$env:GITHUB_WORKSPACE\vcpkg-ci\bootstrap-vcpkg.bat"

      - name: Install vcpkg dependencies (static triplet)
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE\vcpkg-ci\vcpkg.exe" install `
            openssl:x64-windows-static `
            libqrencode:x64-windows-static

      - name: Configure with ASan
        id: asan_configure
        shell: pwsh
        continue-on-error: true
        run: |
          # RelWithDebInfo, not Debug: MSVC's /RTC runtime checks (default
          # in Debug) are incompatible with /fsanitize=address. Keep debug
          # symbols (/Zi via RelWithDebInfo) so a crash report has real
          # file/line info instead of just addresses.
          cmake -B build_asan -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="$env:GITHUB_WORKSPACE\vcpkg-ci\scripts\buildsystems\vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static `
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded `
            -DCMAKE_BUILD_TYPE=RelWithDebInfo `
            -DCMAKE_CXX_FLAGS="/fsanitize=address /Zi" `
            -DCMAKE_EXE_LINKER_FLAGS="/INCREMENTAL:NO" *>&1 | Tee-Object -FilePath asan_configure_output.log
          exit $LASTEXITCODE

      - name: Build rin_tests with ASan
        id: asan_build
        if: steps.asan_configure.outcome == 'success'
        shell: pwsh
        continue-on-error: true
        run: |
          cmake --build build_asan --config RelWithDebInfo --target rin_tests -j *>&1 | Tee-Object -FilePath asan_build_output.log
          exit $LASTEXITCODE

      - name: Run rin_tests directly under ASan
        id: asan_run
        if: steps.asan_build.outcome == 'success'
        shell: pwsh
        continue-on-error: true
        env:
          ASAN_OPTIONS: "print_stats=1"
        run: |
          # MSVC's ASan runtime on Windows is a documented gap in the
          # toolchain, not something specific to this repo: an ASan-
          # instrumented exe fails immediately with STATUS_DLL_INIT_FAILED
          # and produces ZERO output -- not even to a Tee-Object'd file --
          # if clang_rt.asan_dynamic-x86_64.dll isn't sitting next to the
          # exe or otherwise on PATH. Confirmed via multiple independent
          # reports of this exact symptom on GitHub-hosted Windows runners
          # (actions/runner-images#8891, MS C++ team blog on the 17.7+
          # ASan DLL changes). The documented workaround is to copy the
          # DLL alongside the executable before running it.
          #
          # cl.exe is NOT on PATH in a plain pwsh step (only inside the
          # cmake --build step, where MSBuild finds it internally without
          # needing PATH) -- confirmed by run 28's "'cl.exe' is not
          # recognized" failure. Use vswhere (always present on GitHub's
          # Windows runners) to locate the VS install instead.
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsInstallPath = & $vswhere -latest -property installationPath
          $asanDll = Get-ChildItem -Path "$vsInstallPath\VC\Tools\MSVC" -Filter "clang_rt.asan_dynamic-x86_64.dll" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName
          if ($asanDll) {
            Copy-Item $asanDll "build_asan\tests\RelWithDebInfo\" -Force
            Write-Host "Copied ASan runtime DLL from $asanDll"
          } else {
            Write-Warning "clang_rt.asan_dynamic-x86_64.dll not found under $vsInstallPath -- ASan run will likely fail to launch at all."
          }
          & "build_asan\tests\RelWithDebInfo\rin_tests.exe" *>&1 | Tee-Object -FilePath asan_run_output.log
          exit $LASTEXITCODE

      - name: Upload ASan diagnostic logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: asan-diagnostic-logs-run${{ github.run_number }}
          path: |
            asan_configure_output.log
            asan_build_output.log
            asan_run_output.log
          if-no-files-found: ignore
          retention-days: 30

      - name: Fail the job if the ASan run itself failed
        if: steps.asan_run.outcome == 'failure'
        shell: pwsh
        run: |
          Write-Error "rin_tests crashed/failed under ASan -- see the asan-diagnostic-logs artifact for the report."
          exit 1

  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Bootstrap vcpkg
        shell: pwsh
        run: |
          # Not using the runner's pre-installed vcpkg: VCPKG_INSTALLATION_ROOT
          # has a documented history of pointing at different things across
          # runner image versions -- sometimes a plain C:\vcpkg, sometimes the
          # MSVC-bundled copy under "Program Files", which doesn't support
          # classic-mode `vcpkg install` the same way (see
          # actions/runner-images#9269). Cloning our own avoids depending on
          # whichever one happens to be there.
          git clone https://github.com/microsoft/vcpkg.git "$env:GITHUB_WORKSPACE\vcpkg-ci"
          & "$env:GITHUB_WORKSPACE\vcpkg-ci\bootstrap-vcpkg.bat"

      - name: Install vcpkg dependencies (static triplet)
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE\vcpkg-ci\vcpkg.exe" install `
            openssl:x64-windows-static `
            libqrencode:x64-windows-static

      # ZXing is intentionally not installed here -- CMakeLists.txt/
      # tests/CMakeLists.txt both treat it as optional and skip the
      # ZXing-dependent parts (camera QR scanning, one round-trip test)
      # when it's not found, per their own comments.

      - name: Configure (static CRT + static vcpkg triplet)
        id: cmake_configure
        shell: pwsh
        continue-on-error: true
        run: |
          cmake -B build -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="$env:GITHUB_WORKSPACE\vcpkg-ci\scripts\buildsystems\vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static `
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded *>&1 | Tee-Object -FilePath cmake_configure_output.log
          exit $LASTEXITCODE

      - name: Build (Release)
        id: cmake_build
        if: steps.cmake_configure.outcome == 'success'
        shell: pwsh
        continue-on-error: true
        run: |
          cmake --build build --config Release -j *>&1 | Tee-Object -FilePath cmake_build_output.log
          exit $LASTEXITCODE

      - name: Run test suite
        id: run_tests
        if: steps.cmake_build.outcome == 'success'
        shell: pwsh
        continue-on-error: true
        run: |
          ctest --test-dir build -C Release --output-on-failure *>&1 | Tee-Object -FilePath ctest_output.log
          exit $LASTEXITCODE

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: build-logs-run${{ github.run_number }}
          path: |
            cmake_configure_output.log
            cmake_build_output.log
            ctest_output.log
          if-no-files-found: ignore
          retention-days: 30

      - name: Fail the job if configure actually failed
        if: steps.cmake_configure.outcome == 'failure'
        shell: pwsh
        run: exit 1

      - name: Fail the job if build actually failed
        if: steps.cmake_build.outcome == 'failure'
        shell: pwsh
        run: exit 1

      - name: Fail the job if tests actually failed
        if: steps.run_tests.outcome == 'failure'
        shell: pwsh
        run: exit 1

      - name: Verify expected executables exist
        shell: pwsh
        run: |
          foreach ($exe in "build\Release\RinWindows.exe", "build\Release\rin-console.exe") {
            if (-not (Test-Path $exe)) {
              Write-Error "$exe was not produced -- check the build-logs artifact above."
              exit 1
            }
          }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Compile installer.iss
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "installer.iss"

      - name: Locate compiled installer
        id: out
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path "dist" -Filter "Rin-Setup-*.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) {
            Write-Error "No Rin-Setup-*.exe found in dist\ -- check the ISCC log above."
            exit 1
          }
          echo "path=$($exe.FullName)" >> $env:GITHUB_OUTPUT
          echo "name=$($exe.Name)" >> $env:GITHUB_OUTPUT

      - name: Upload build artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.out.outputs.name }}
          path: ${{ steps.out.outputs.path }}
          retention-days: 30

      - name: Publish GitHub Release
        if: github.event_name == 'workflow_dispatch' && inputs.publish_release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v1.0.0-${{ github.run_number }}
          name: Rin (Windows) build ${{ github.run_number }}
          files: ${{ steps.out.outputs.path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
